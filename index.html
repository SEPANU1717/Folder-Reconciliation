<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folder Reconciliation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F3;
    --paper-raised:#FDFCFA;
    --ink:#1A1A18;
    --graphite:#6B6862;
    --graphite-light:#A6A29A;
    --line:#DEDBD3;
    --line-strong:#C7C2B8;
    --pine:#2E5E4E;
    --pine-bg:#E7EEEA;
    --brick:#9C3B2E;
    --brick-bg:#F3E5E1;
    --amber:#8A6A1E;
    --amber-bg:#F3EBD9;
    --cobalt:#2447A8;
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:56px 32px 96px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    padding-bottom:28px;
    border-bottom:1px solid var(--line-strong);
    margin-bottom:40px;
    position:relative;
  }
  .brand{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--graphite);
    text-transform:uppercase;
    margin:0 0 14px;
  }
  .brand span{color:var(--cobalt);}
  h1{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:30px;
    letter-spacing:-0.01em;
    margin:0 0 8px;
  }
  .subtitle{
    color:var(--graphite);
    font-size:15px;
    max-width:46ch;
    line-height:1.5;
    margin:0;
  }

  /* ---------- Stamp (signature element) ---------- */
  .stamp{
    position:absolute;
    top:4px;
    right:0;
    width:118px;
    height:118px;
    border:2.5px solid var(--pine);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    transform:rotate(-9deg) scale(0.5);
    opacity:0;
    transition:opacity .35s ease, transform .35s cubic-bezier(.2,.8,.3,1.2);
    pointer-events:none;
  }
  .stamp.show{
    opacity:1;
    transform:rotate(-9deg) scale(1);
  }
  .stamp.discrepancy{border-color:var(--brick);}
  .stamp-inner{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:11.5px;
    letter-spacing:.09em;
    color:var(--pine);
    line-height:1.5;
  }
  .stamp.discrepancy .stamp-inner{color:var(--brick);}
  @media (prefers-reduced-motion: reduce){
    .stamp{transition:none;}
  }

  /* ---------- Intake zones ---------- */
  .intake{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:36px;
  }
  @media (max-width:640px){ .intake{grid-template-columns:1fr;} }

  .dropzone{
    border:1.5px dashed var(--line-strong);
    background:var(--paper-raised);
    padding:28px 24px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    position:relative;
  }
  .dropzone:hover, .dropzone:focus-visible{
    border-color:var(--cobalt);
    outline:none;
  }
  .dropzone:focus-visible{
    box-shadow:0 0 0 3px rgba(36,71,168,0.15);
  }
  .dropzone.dragover{
    border-color:var(--cobalt);
    background:#F0F3FA;
  }
  .dropzone.loaded{
    border-style:solid;
    border-color:var(--pine);
    background:var(--pine-bg);
  }
  .dz-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--graphite);
    margin:0 0 12px;
    display:flex;
    justify-content:space-between;
  }
  .dz-tag{color:var(--graphite-light);}
  .dz-name{
    font-weight:600;
    font-size:16px;
    margin:0 0 4px;
    word-break:break-word;
  }
  .dz-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--graphite);
    margin:0;
  }
  .dz-hint{
    font-size:13px;
    color:var(--graphite);
    margin:0;
  }
  .dz-icon{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    color:var(--line-strong);
    margin-bottom:10px;
    display:block;
  }
  .dropzone.loaded .dz-icon{color:var(--pine);}
  input[type=file]{
    position:absolute;
    width:1px;height:1px;
    opacity:0;overflow:hidden;
  }

  /* ---------- Actions ---------- */
  .actions{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:40px;
  }
  button.primary{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:1px solid var(--ink);
    padding:12px 22px;
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
  }
  button.primary:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  button.primary:not(:disabled):hover{background:#3a3a36;}
  button.ghost{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:transparent;
    color:var(--graphite);
    border:1px solid var(--line-strong);
    padding:12px 18px;
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--ink); color:var(--ink);}
  button:focus-visible{outline:2px solid var(--cobalt); outline-offset:2px;}
  .status-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--graphite);
  }

  /* ---------- Summary ---------- */
  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border:1px solid var(--line-strong);
    margin-bottom:28px;
    background:var(--paper-raised);
  }
  @media (max-width:640px){ .summary{grid-template-columns:repeat(2,1fr);} }
  .summary.cols-5{grid-template-columns:repeat(5,1fr);}
  @media (max-width:900px){ .summary.cols-5{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:640px){ .summary.cols-5{grid-template-columns:repeat(2,1fr);} }
  .summary-cell{
    padding:18px 20px;
    border-right:1px solid var(--line);
  }
  .summary-cell:last-child{border-right:none;}
  .summary-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:26px;
    font-weight:600;
    line-height:1;
    margin-bottom:6px;
  }
  .summary-label{
    font-size:11.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--graphite);
  }
  .summary-cell.match .summary-num{color:var(--pine);}
  .summary-cell.diff .summary-num{color:var(--brick);}

  /* ---------- Ledger ---------- */
  .ledger-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .ledger-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--graphite);
  }
  .filter-row{
    display:flex;
    gap:6px;
  }
  .filter-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--graphite);
    padding:6px 10px;
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  .ledger{
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
  }
  .row{
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row-main{
    display:grid;
    grid-template-columns:28px 1fr 90px 90px 150px;
    align-items:center;
    padding:13px 16px;
    cursor:pointer;
    gap:10px;
  }
  .row-main:hover{background:#FBFAF8;}
  @media (max-width:720px){
    .row-main{grid-template-columns:20px 1fr 60px;}
    .col-a,.col-b{display:none;}
  }
  .caret{
    font-size:10px;
    color:var(--graphite-light);
    transition:transform .15s ease;
  }
  .row.open .caret{transform:rotate(90deg);}
  .col-path{
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    word-break:break-all;
  }
  .col-a,.col-b{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--graphite);
    text-align:center;
  }
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:4px 9px;
    text-align:center;
    display:inline-block;
    justify-self:end;
  }
  .badge.match{background:var(--pine-bg); color:var(--pine);}
  .badge.count{background:var(--brick-bg); color:var(--brick);}
  .badge.names{background:var(--brick-bg); color:var(--brick);}
  .badge.case{background:var(--amber-bg); color:var(--amber);}
  .badge.unmatched{background:var(--brick-bg); color:var(--brick);}
  .badge.missingA, .badge.missingB{background:var(--brick-bg); color:var(--brick);}

  .row-detail{
    display:none;
    padding:4px 16px 18px 54px;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  .row.open .row-detail{display:grid;}
  @media (max-width:640px){ .row-detail{grid-template-columns:1fr; padding-left:20px;} }
  .detail-col h4{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--graphite);
    margin:0 0 8px;
  }
  .detail-list{
    list-style:none;
    margin:0;
    padding:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    line-height:1.9;
  }
  .detail-list li{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .dot{
    width:5px;height:5px;
    border-radius:50%;
    background:var(--graphite-light);
    flex:none;
  }
  .dot.only{background:var(--brick);}
  .file-only{color:var(--brick);}
  .vs-word{
    color:var(--graphite-light);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:11px;
    font-style:italic;
    margin:0 8px;
  }
  .empty-note{color:var(--graphite-light); font-style:normal;}

  /* ---------- View tabs ---------- */
  .view-tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .view-tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.07em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--graphite);
    padding:10px 16px;
    cursor:pointer;
  }
  .view-tab:hover{border-color:var(--ink); color:var(--ink);}
  .view-tab.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  /* ---------- Preview gallery ---------- */
  .gsection{ margin-bottom:32px; }
  .gsection:last-child{ margin-bottom:0; }
  .gsection-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding-bottom:8px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line-strong);
    cursor:pointer;
  }
  .gsection-head:hover .gsection-title{ color:var(--cobalt); }
  .gsection-caret{
    font-size:10px;
    color:var(--graphite-light);
    transform:rotate(90deg);
    transition:transform .15s ease;
    flex:none;
  }
  .gsection.collapsed .gsection-caret{ transform:rotate(0deg); }
  .gsection-title{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
    letter-spacing:.01em;
    transition:color .15s ease;
  }
  .gsection-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--graphite);
    margin-left:auto;
  }
  .gsection.collapsed .gallery{ display:none; }
  .filter-btn.expand-toggle{
    margin-left:auto;
    color:var(--cobalt);
    border-color:var(--cobalt);
  }
  .filter-btn.expand-toggle:hover{ background:var(--cobalt); color:#fff; }
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:16px;
  }
  .gcard{
    border:1px solid var(--line-strong);
    border-top:3px solid var(--line-strong);
    background:var(--paper-raised);
  }
  .gcard.match{border-top-color:var(--pine);}
  .gcard.case{border-top-color:var(--amber);}
  .gcard.unmatched{border-top-color:var(--brick);}
  .gcard.missingA, .gcard.missingB{border-top-color:var(--brick);}
  .gcard-top{
    display:flex;
  }
  .gthumb{
    flex:1;
    aspect-ratio:1/1;
    background:#EFEDE8;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:1px solid var(--line);
  }
  .gthumb:last-child{border-right:none;}
  .gthumb img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .gthumb.missing{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--graphite-light);
    letter-spacing:.04em;
  }
  .gtag{
    position:absolute;
    top:6px;
    left:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:.06em;
    background:rgba(26,26,24,0.78);
    color:#fff;
    padding:2px 6px;
  }
  .gcard-meta{
    padding:10px 12px 12px;
    border-top:1px solid var(--line);
  }
  .gidx{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--graphite-light);
    display:block;
    margin-bottom:6px;
  }
  .gnames{
    margin-bottom:8px;
  }
  .gname-row{
    display:flex;
    gap:6px;
    align-items:baseline;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    line-height:1.6;
  }
  .gname-tag{
    flex:none;
    color:var(--graphite-light);
    width:11px;
  }
  .gname-val{
    word-break:break-all;
    color:var(--ink);
  }
  .gname-val.diff{ color:var(--amber); font-weight:600; }
  .gname-val.diff-hard{ color:var(--brick); font-weight:600; }
  .gname-empty{ color:var(--graphite-light); font-weight:400; }

  .empty-state{
    text-align:center;
    padding:64px 24px;
    color:var(--graphite);
  }
  .empty-state .dz-icon{font-size:26px; margin-bottom:14px;}
  .empty-state p{margin:0; font-size:14px;}

  footer{
    margin-top:56px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--graphite-light);
    letter-spacing:.04em;
  }

  .visually-hidden{
    position:absolute!important;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
  }

  .print-only{ display:none; }

  @media print{
    body{ background:#fff; }
    .wrap{ max-width:none; padding:18px 22px; }
    header{ margin-bottom:22px; padding-bottom:18px; }
    .stamp{ transform:rotate(-9deg) scale(1); opacity:1; position:absolute; }
    .intake, .actions, footer{ display:none !important; }
    .filter-row{ display:none !important; }
    .view-tabs{ display:none !important; }
    .gallery{ display:none !important; }
    .print-only{
      display:block;
      font-family:'IBM Plex Mono', monospace;
      font-size:11.5px;
      color:var(--graphite);
      margin:-14px 0 22px;
      padding-bottom:14px;
      border-bottom:1px solid var(--line-strong);
      line-height:1.9;
    }
    .print-only .pr-row{ display:flex; gap:8px; }
    .print-only b{ color:var(--ink); font-weight:600; }
    .summary{ break-inside:avoid; }
    .ledger{ border-color:#000; }
    .row{ break-inside:avoid; border-bottom-color:#ccc; }
    .row-main{ cursor:default; }
    .caret{ display:none; }
    .row-detail{ display:grid !important; }
    .row-main:hover{ background:none; }
    .badge{ border:1px solid currentColor; }
    a[href]:after{ content:""; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="brand">RECON<span>·</span>FOLDERS</p>
      <h1>Folder Reconciliation</h1>
      <p class="subtitle">Upload two directory trees. Every subfolder is checked for a matching name, file count, and filename set — with side-by-side thumbnails for image files.</p>
    </div>
    <div class="stamp" id="stamp" aria-hidden="true">
      <div class="stamp-inner" id="stampText">MATCHED</div>
    </div>
  </header>

  <div class="intake">
    <label class="dropzone" id="dzA" tabindex="0">
      <span class="dz-icon">⌷</span>
      <p class="dz-label"><span>Source</span><span class="dz-tag">A</span></p>
      <p class="dz-name" id="nameA">No folder selected</p>
      <p class="dz-hint" id="hintA">Click to browse, or drag a folder here</p>
      <input type="file" id="inputA" webkitdirectory directory multiple>
    </label>

    <label class="dropzone" id="dzB" tabindex="0">
      <span class="dz-icon">⌷</span>
      <p class="dz-label"><span>Target</span><span class="dz-tag">B</span></p>
      <p class="dz-name" id="nameB">No folder selected</p>
      <p class="dz-hint" id="hintB">Click to browse, or drag a folder here</p>
      <input type="file" id="inputB" webkitdirectory directory multiple>
    </label>
  </div>

  <div class="actions">
    <button class="primary" id="compareBtn" disabled>Compare folders</button>
    <button class="ghost" id="exportBtn" disabled>Export PDF</button>
    <button class="ghost" id="resetBtn">Reset</button>
    <span class="status-line" id="statusLine"></span>
  </div>

  <div id="printHeader" class="print-only"></div>
  <div id="results"></div>

  <footer>All comparison happens locally in your browser — no files are uploaded anywhere.</footer>
</div>

<script>
(function(){
  const state = { a: null, b: null };

  const dzA = document.getElementById('dzA');
  const dzB = document.getElementById('dzB');
  const inputA = document.getElementById('inputA');
  const inputB = document.getElementById('inputB');
  const nameA = document.getElementById('nameA');
  const nameB = document.getElementById('nameB');
  const hintA = document.getElementById('hintA');
  const hintB = document.getElementById('hintB');
  const compareBtn = document.getElementById('compareBtn');
  const exportBtn = document.getElementById('exportBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statusLine = document.getElementById('statusLine');
  const results = document.getElementById('results');
  const printHeader = document.getElementById('printHeader');
  const stamp = document.getElementById('stamp');
  const stampText = document.getElementById('stampText');

  // ---------- Folder tree ingestion ----------

  const IMAGE_EXT_RE = /\.(png|jpe?g|webp|gif|bmp|svg|avif|tiff?)$/i;
  function isImageFile(name){ return IMAGE_EXT_RE.test(name || ''); }

  function countImages(folders){
    let n = 0;
    folders.forEach(node => { n += node.images.size; });
    return n;
  }

  // Build a tree keyed by folder path relative to the uploaded root.
  // "" (empty string) represents the root folder itself.
  function buildTree(entries, rootName){
    const folders = new Map(); // key -> { files: Set, images: Map(filename -> File) }
    folders.set('', { files: new Set(), images: new Map() });

    entries.forEach(({ relativePath, file }) => {
      const parts = relativePath.split('/').filter(Boolean);
      // parts[0] is the root folder name; drop it for comparison purposes
      const inner = parts.slice(1);
      if (inner.length === 0) return;
      const filename = inner[inner.length - 1];
      const folderParts = inner.slice(0, -1);
      const folderKey = folderParts.join('/');

      if (!folders.has(folderKey)) folders.set(folderKey, { files: new Set(), images: new Map() });
      const node = folders.get(folderKey);
      node.files.add(filename);
      if (file && isImageFile(filename)) node.images.set(filename, file);

      // Ensure every ancestor folder exists in the map too
      let acc = [];
      for (const p of folderParts){
        acc.push(p);
        const key = acc.join('/');
        if (!folders.has(key)) folders.set(key, { files: new Set(), images: new Map() });
      }
    });

    return { rootName, folders };
  }

  function fileListToEntries(fileList){
    return Array.from(fileList).map(f => ({ relativePath: f.webkitRelativePath || f.name, file: f }));
  }

  function rootNameFromEntries(entries){
    if (!entries.length) return '';
    return entries[0].relativePath.split('/')[0];
  }

  function totalFileCount(entries){
    return entries.length;
  }

  // ---------- Wiring: click-to-browse ----------

  function setupDropzone(dz, input, side){
    dz.addEventListener('click', (e) => { if (e.target !== input) input.click(); });
    dz.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); input.click(); }
    });
    input.addEventListener('change', () => {
      if (!input.files || !input.files.length) return;
      ingest(side, fileListToEntries(input.files));
    });

    // Drag & drop support (folder via DataTransferItemList + webkitGetAsEntry)
    ['dragenter','dragover'].forEach(evt => dz.addEventListener(evt, (e) => {
      e.preventDefault(); e.stopPropagation();
      dz.classList.add('dragover');
    }));
    ['dragleave','drop'].forEach(evt => dz.addEventListener(evt, (e) => {
      e.preventDefault(); e.stopPropagation();
      dz.classList.remove('dragover');
    }));
    dz.addEventListener('drop', async (e) => {
      const items = e.dataTransfer.items;
      if (!items || !items.length) return;
      const entryPromises = [];
      for (const item of items){
        const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
        if (entry) entryPromises.push(readEntryRecursive(entry, ''));
      }
      setStatus(side, 'Reading dropped folder…');
      const nested = await Promise.all(entryPromises);
      const flat = nested.flat();
      if (flat.length) ingest(side, flat);
      else setStatus(side, 'Could not read a folder from that drop — try click-to-browse instead.');
    });
  }

  function readEntryRecursive(entry, prefix){
    return new Promise((resolve) => {
      if (entry.isFile){
        entry.file(file => {
          resolve([{ relativePath: prefix + entry.name, file }]);
        }, () => resolve([]));
      } else if (entry.isDirectory){
        const reader = entry.createReader();
        let all = [];
        const readBatch = () => {
          reader.readEntries(async (batch) => {
            if (!batch.length){
              const nested = await Promise.all(all.map(en => readEntryRecursive(en, prefix + entry.name + '/')));
              resolve(nested.flat());
              return;
            }
            all = all.concat(batch);
            readBatch();
          }, () => resolve([]));
        };
        readBatch();
      } else {
        resolve([]);
      }
    });
  }

  function setStatus(side, msg){
    statusLine.textContent = msg;
  }

  function ingest(side, entries){
    const rootName = rootNameFromEntries(entries);
    const tree = buildTree(entries, rootName);
    const count = totalFileCount(entries);

    if (side === 'a'){
      state.a = tree;
      dzA.classList.add('loaded');
      nameA.textContent = rootName || '—';
      hintA.textContent = count + ' file' + (count === 1 ? '' : 's') + ' · ' + countImages(tree.folders) + ' image' + (countImages(tree.folders) === 1 ? '' : 's') + ' · ' + (tree.folders.size) + ' folder' + (tree.folders.size === 1 ? '' : 's');
    } else {
      state.b = tree;
      dzB.classList.add('loaded');
      nameB.textContent = rootName || '—';
      hintB.textContent = count + ' file' + (count === 1 ? '' : 's') + ' · ' + countImages(tree.folders) + ' image' + (countImages(tree.folders) === 1 ? '' : 's') + ' · ' + (tree.folders.size) + ' folder' + (tree.folders.size === 1 ? '' : 's');
    }
    statusLine.textContent = '';
    compareBtn.disabled = !(state.a && state.b);
  }

  setupDropzone(dzA, inputA, 'a');
  setupDropzone(dzB, inputB, 'b');

  // ---------- Comparison ----------

  function compare(){
    const foldersA = state.a.folders;
    const foldersB = state.b.folders;
    const allKeys = new Set([...foldersA.keys(), ...foldersB.keys()]);
    const sortedKeys = Array.from(allKeys).sort((x, y) => {
      if (x === '') return -1;
      if (y === '') return 1;
      return x.localeCompare(y);
    });

    const rows = sortedKeys.map(key => {
      const inA = foldersA.has(key);
      const inB = foldersB.has(key);
      const filesA = inA ? foldersA.get(key).files : new Set();
      const filesB = inB ? foldersB.get(key).files : new Set();

      // Exact (case-sensitive) diff first
      let onlyInA = [...filesA].filter(f => !filesB.has(f)).sort();
      let onlyInB = [...filesB].filter(f => !filesA.has(f)).sort();

      // Among the exact leftovers, find pairs that only differ by case
      const casePairs = [];
      if (onlyInA.length && onlyInB.length){
        const bByLower = new Map();
        onlyInB.forEach(f => bByLower.set(f.toLowerCase(), f));
        const matchedB = new Set();
        onlyInA.forEach(fa => {
          const lower = fa.toLowerCase();
          const fb = bByLower.get(lower);
          if (fb && !matchedB.has(fb)){
            casePairs.push({ a: fa, b: fb });
            matchedB.add(fb);
          }
        });
        if (casePairs.length){
          const usedA = new Set(casePairs.map(p => p.a));
          const usedB = new Set(casePairs.map(p => p.b));
          onlyInA = onlyInA.filter(f => !usedA.has(f));
          onlyInB = onlyInB.filter(f => !usedB.has(f));
        }
      }

      let status;
      if (!inA && inB) status = 'missingA';
      else if (inA && !inB) status = 'missingB';
      else if (filesA.size !== filesB.size){
        status = 'count';
      } else if (onlyInA.length === 0 && onlyInB.length === 0 && casePairs.length === 0){
        status = 'match';
      } else if (onlyInA.length === 0 && onlyInB.length === 0 && casePairs.length > 0){
        status = 'case';
      } else {
        status = 'names';
      }

      return {
        key,
        label: key === '' ? '/ (root)' : key,
        countA: inA ? filesA.size : null,
        countB: inB ? filesB.size : null,
        status,
        onlyInA,
        onlyInB,
        casePairs,
        matched: [...filesA].filter(f => filesB.has(f)).sort()
      };
    });

    return rows;
  }

  // ---------- Image preview gallery ----------

  const objectUrlCache = new Map(); // cacheKey -> url

  function getObjectUrl(file, cacheKey){
    if (!file) return null;
    if (objectUrlCache.has(cacheKey)) return objectUrlCache.get(cacheKey);
    const url = URL.createObjectURL(file);
    objectUrlCache.set(cacheKey, url);
    return url;
  }

  function revokeAllObjectUrls(){
    objectUrlCache.forEach(url => URL.revokeObjectURL(url));
    objectUrlCache.clear();
  }

  function buildGalleryCards(rows){
    const foldersA = state.a.folders;
    const foldersB = state.b.folders;
    const cards = [];

    rows.forEach(row => {
      const inA = foldersA.has(row.key);
      const inB = foldersB.has(row.key);
      const imagesA = (foldersA.get(row.key) || {}).images || new Map();
      const imagesB = (foldersB.get(row.key) || {}).images || new Map();

      row.matched.filter(isImageFile).forEach(n => {
        cards.push({ folder: row.label, folderKey: row.key, status: 'match', nameA: n, nameB: n, fileA: imagesA.get(n), fileB: imagesB.get(n) });
      });

      row.casePairs.forEach(p => {
        if (isImageFile(p.a) || isImageFile(p.b)){
          cards.push({ folder: row.label, folderKey: row.key, status: 'case', nameA: p.a, nameB: p.b, fileA: imagesA.get(p.a) || null, fileB: imagesB.get(p.b) || null });
        }
      });

      const leftoverA = row.onlyInA.filter(isImageFile);
      const leftoverB = row.onlyInB.filter(isImageFile);

      if (inA && inB){
        // The folder itself exists on both sides — pair up remaining, differently-named
        // images positionally so they can still be compared side by side, flagged as unmatched.
        const pairCount = Math.min(leftoverA.length, leftoverB.length);
        for (let i = 0; i < pairCount; i++){
          const nA = leftoverA[i];
          const nB = leftoverB[i];
          cards.push({ folder: row.label, folderKey: row.key, status: 'unmatched', nameA: nA, nameB: nB, fileA: imagesA.get(nA), fileB: imagesB.get(nB) });
        }
        for (let i = pairCount; i < leftoverA.length; i++){
          const n = leftoverA[i];
          cards.push({ folder: row.label, folderKey: row.key, status: 'missingB', nameA: n, nameB: null, fileA: imagesA.get(n), fileB: null });
        }
        for (let i = pairCount; i < leftoverB.length; i++){
          const n = leftoverB[i];
          cards.push({ folder: row.label, folderKey: row.key, status: 'missingA', nameA: null, nameB: n, fileA: null, fileB: imagesB.get(n) });
        }
      } else {
        // Whole folder only exists on one side — nothing to pair against.
        leftoverA.forEach(n => cards.push({ folder: row.label, folderKey: row.key, status: 'missingB', nameA: n, nameB: null, fileA: imagesA.get(n), fileB: null }));
        leftoverB.forEach(n => cards.push({ folder: row.label, folderKey: row.key, status: 'missingA', nameA: null, nameB: n, fileA: null, fileB: imagesB.get(n) }));
      }
    });

    return cards;
  }

  function badgeMeta(status){
    switch(status){
      case 'match': return { cls: 'match', label: 'Match' };
      case 'count': return { cls: 'count', label: 'Count not equal' };
      case 'names': return { cls: 'names', label: 'Names not equal' };
      case 'case': return { cls: 'case', label: 'Case not same' };
      case 'unmatched': return { cls: 'unmatched', label: 'Not matched' };
      case 'missingA': return { cls: 'missingA', label: 'Missing in A' };
      case 'missingB': return { cls: 'missingB', label: 'Missing in B' };
    }
  }

  let currentRows = [];
  let currentCards = [];
  let currentFilter = 'all';
  let galleryFilter = 'all';
  let currentView = 'manifest';

  function renderSummaryHtml(){
    const rows = currentRows;
    const total = rows.length;

    if (currentView === 'gallery'){
      const matched = currentCards.filter(c => c.status === 'match').length;
      const flagged = currentCards.filter(c => c.status === 'case').length;
      const missing = currentCards.filter(c => c.status === 'missingA' || c.status === 'missingB' || c.status === 'unmatched').length;
      const loadedA = countImages(state.a.folders);
      const loadedB = countImages(state.b.folders);
      return `
        <div class="summary cols-5">
          <div class="summary-cell match"><div class="summary-num">${matched}</div><div class="summary-label">Matched pairs</div></div>
          <div class="summary-cell diff"><div class="summary-num">${flagged}</div><div class="summary-label">Flagged for review</div></div>
          <div class="summary-cell diff"><div class="summary-num">${missing}</div><div class="summary-label">Missing / unmatched</div></div>
          <div class="summary-cell"><div class="summary-num">${loadedA}</div><div class="summary-label">Images loaded (A)</div></div>
          <div class="summary-cell"><div class="summary-num">${loadedB}</div><div class="summary-label">Images loaded (B)</div></div>
        </div>`;
    }

    const matched = rows.filter(r => r.status === 'match').length;
    const mismatched = rows.filter(r => r.status === 'count' || r.status === 'names' || r.status === 'case').length;
    const missing = rows.filter(r => r.status === 'missingA' || r.status === 'missingB').length;
    return `
      <div class="summary">
        <div class="summary-cell"><div class="summary-num">${total}</div><div class="summary-label">Folders compared</div></div>
        <div class="summary-cell match"><div class="summary-num">${matched}</div><div class="summary-label">Fully matched</div></div>
        <div class="summary-cell diff"><div class="summary-num">${mismatched}</div><div class="summary-label">Mismatched</div></div>
        <div class="summary-cell diff"><div class="summary-num">${missing}</div><div class="summary-label">Missing entirely</div></div>
      </div>`;
  }

  function renderManifestHtml(){
    const rows = currentRows;
    const filtered = currentFilter === 'all' ? rows :
      currentFilter === 'match' ? rows.filter(r => r.status === 'match') :
      rows.filter(r => r.status !== 'match');

    const rowsHtml = filtered.map((r, i) => {
      const meta = badgeMeta(r.status);
      const colA = r.countA === null ? '—' : r.countA;
      const colB = r.countB === null ? '—' : r.countB;

      const listA = r.onlyInA.length
        ? r.onlyInA.map(f => `<li><span class="dot only"></span><span class="file-only">${escapeHtml(f)}</span></li>`).join('')
        : '<li class="empty-note">— none —</li>';
      const listB = r.onlyInB.length
        ? r.onlyInB.map(f => `<li><span class="dot only"></span><span class="file-only">${escapeHtml(f)}</span></li>`).join('')
        : '<li class="empty-note">— none —</li>';

      const detailBody = (r.casePairs && r.casePairs.length)
        ? `
            <div class="detail-col" style="grid-column:1 / -1;">
              <h4>Casing differs</h4>
              <ul class="detail-list">
                ${r.casePairs.map(p => `<li><span class="dot only"></span><span class="file-only">${escapeHtml(p.a)}</span><span class="vs-word">vs</span><span class="file-only">${escapeHtml(p.b)}</span></li>`).join('')}
              </ul>
            </div>`
        : `
            <div class="detail-col">
              <h4>Only in Source (A)</h4>
              <ul class="detail-list">${listA}</ul>
            </div>
            <div class="detail-col">
              <h4>Only in Target (B)</h4>
              <ul class="detail-list">${listB}</ul>
            </div>`;

      return `
        <div class="row" data-idx="${i}">
          <div class="row-main" role="button" tabindex="0">
            <span class="caret">▸</span>
            <span class="col-path">${escapeHtml(r.label)}</span>
            <span class="col-a">${colA}</span>
            <span class="col-b">${colB}</span>
            <span class="badge ${meta.cls}">${meta.label}</span>
          </div>
          <div class="row-detail">
            ${detailBody}
          </div>
        </div>`;
    }).join('');

    return `
      <div class="ledger-head">
        <span class="ledger-title">Manifest — ${rows.length} folder${rows.length === 1 ? '' : 's'}</span>
        <div class="filter-row">
          <button class="filter-btn ${currentFilter==='all'?'active':''}" data-filter="all">All</button>
          <button class="filter-btn ${currentFilter==='match'?'active':''}" data-filter="match">Matched</button>
          <button class="filter-btn ${currentFilter==='issues'?'active':''}" data-filter="issues">Issues</button>
          ${filtered.length ? '<button class="filter-btn expand-toggle" data-expand-target="manifest">Expand all</button>' : ''}
        </div>
      </div>
      <div class="ledger">
        ${filtered.length ? rowsHtml : '<div class="empty-state"><span class="dz-icon">⌷</span><p>Nothing in this view.</p></div>'}
      </div>`;
  }

  function groupCardsByFolder(cards){
    const order = [];
    const map = new Map();
    cards.forEach(c => {
      if (!map.has(c.folderKey)){
        map.set(c.folderKey, { label: c.folder, items: [] });
        order.push(c.folderKey);
      }
      map.get(c.folderKey).items.push(c);
    });
    return order.map(key => map.get(key));
  }

  function renderGalleryCard(c, idx){
    const meta = badgeMeta(c.status);
    const urlA = c.fileA ? getObjectUrl(c.fileA, 'a:' + c.folderKey + ':' + c.nameA) : null;
    const urlB = c.fileB ? getObjectUrl(c.fileB, 'b:' + c.folderKey + ':' + c.nameB) : null;

    const thumbA = urlA
      ? `<div class="gthumb"><span class="gtag">A</span><img src="${urlA}" alt="${escapeHtml(c.nameA || '')}" loading="lazy"></div>`
      : `<div class="gthumb missing"><span class="gtag">A</span><span>No file</span></div>`;
    const thumbB = urlB
      ? `<div class="gthumb"><span class="gtag">B</span><img src="${urlB}" alt="${escapeHtml(c.nameB || '')}" loading="lazy"></div>`
      : `<div class="gthumb missing"><span class="gtag">B</span><span>No file</span></div>`;

    const namesDiffer = c.nameA && c.nameB && c.nameA !== c.nameB;
    const diffClass = namesDiffer ? (c.status === 'unmatched' ? ' diff-hard' : ' diff') : '';
    const rowA = `<div class="gname-row"><span class="gname-tag">A</span><span class="gname-val${diffClass}">${c.nameA ? escapeHtml(c.nameA) : '<span class=\"gname-empty\">— missing —</span>'}</span></div>`;
    const rowB = `<div class="gname-row"><span class="gname-tag">B</span><span class="gname-val${diffClass}">${c.nameB ? escapeHtml(c.nameB) : '<span class=\"gname-empty\">— missing —</span>'}</span></div>`;

    return `
      <div class="gcard ${c.status}">
        <div class="gcard-top">${thumbA}${thumbB}</div>
        <div class="gcard-meta">
          <span class="gidx">#${idx}</span>
          <div class="gnames">${rowA}${rowB}</div>
          <span class="badge ${meta.cls}">${meta.label}</span>
        </div>
      </div>`;
  }

  function renderGalleryHtml(){
    const cards = currentCards;
    const filtered = galleryFilter === 'all' ? cards :
      galleryFilter === 'match' ? cards.filter(c => c.status === 'match') :
      cards.filter(c => c.status !== 'match');

    const groups = groupCardsByFolder(filtered);

    const bodyHtml = groups.length ? groups.map(group => {
      const matchedCount = group.items.filter(c => c.status === 'match').length;
      const issueCount = group.items.length - matchedCount;
      return `
        <div class="gsection">
          <div class="gsection-head" role="button" tabindex="0">
            <span class="gsection-caret">▸</span>
            <span class="gsection-title">${escapeHtml(group.label)}</span>
            <span class="gsection-count">${group.items.length} image${group.items.length === 1 ? '' : 's'} · ${matchedCount} matched${issueCount ? ' · ' + issueCount + ' issue' + (issueCount === 1 ? '' : 's') : ''}</span>
          </div>
          <div class="gallery">
            ${group.items.map((c, i) => renderGalleryCard(c, i + 1)).join('')}
          </div>
        </div>`;
    }).join('') : '<div class="empty-state"><span class="dz-icon">⌷</span><p>Nothing in this view.</p></div>';

    return `
      <div class="ledger-head">
        <span class="ledger-title">Preview Gallery — ${cards.length} image${cards.length === 1 ? '' : 's'}</span>
        <div class="filter-row">
          <button class="filter-btn ${galleryFilter==='all'?'active':''}" data-gfilter="all">All</button>
          <button class="filter-btn ${galleryFilter==='match'?'active':''}" data-gfilter="match">Matched</button>
          <button class="filter-btn ${galleryFilter==='issues'?'active':''}" data-gfilter="issues">Issues</button>
          ${groups.length ? '<button class="filter-btn expand-toggle" data-expand-target="gallery">Collapse all</button>' : ''}
        </div>
      </div>
      ${bodyHtml}`;
  }

  function renderAll(){
    let html = renderSummaryHtml();

    if (currentCards.length){
      html += `
        <div class="view-tabs">
          <button class="view-tab ${currentView==='manifest'?'active':''}" data-view="manifest">Manifest</button>
          <button class="view-tab ${currentView==='gallery'?'active':''}" data-view="gallery">Image Previews (${currentCards.length})</button>
        </div>`;
    }

    html += currentView === 'gallery' && currentCards.length ? renderGalleryHtml() : renderManifestHtml();

    results.innerHTML = html;

    results.querySelectorAll('.row-main').forEach(el => {
      el.addEventListener('click', () => el.closest('.row').classList.toggle('open'));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.closest('.row').classList.toggle('open'); }
      });
    });

    results.querySelectorAll('.gsection-head').forEach(el => {
      el.addEventListener('click', () => el.closest('.gsection').classList.toggle('collapsed'));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.closest('.gsection').classList.toggle('collapsed'); }
      });
    });

    results.querySelectorAll('[data-expand-target]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.expandTarget === 'manifest'){
          const rows = results.querySelectorAll('.row');
          const anyClosed = [...rows].some(r => !r.classList.contains('open'));
          rows.forEach(r => r.classList.toggle('open', anyClosed));
          btn.textContent = anyClosed ? 'Collapse all' : 'Expand all';
        } else {
          const sections = results.querySelectorAll('.gsection');
          const anyCollapsed = [...sections].some(s => s.classList.contains('collapsed'));
          sections.forEach(s => s.classList.toggle('collapsed', !anyCollapsed));
          btn.textContent = anyCollapsed ? 'Collapse all' : 'Expand all';
        }
      });
    });

    results.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => { currentFilter = btn.dataset.filter; renderAll(); });
    });

    results.querySelectorAll('[data-gfilter]').forEach(btn => {
      btn.addEventListener('click', () => { galleryFilter = btn.dataset.gfilter; renderAll(); });
    });

    results.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => { currentView = btn.dataset.view; renderAll(); });
    });

    updateStamp();
  }

  function updateStamp(){
    const mismatched = currentRows.filter(r => r.status === 'count' || r.status === 'names' || r.status === 'case').length;
    const missing = currentRows.filter(r => r.status === 'missingA' || r.status === 'missingB').length;
    const total = currentRows.length;
    const allGood = mismatched === 0 && missing === 0 && total > 0;

    stamp.classList.remove('show', 'discrepancy');
    void stamp.offsetWidth; // restart animation
    if (total > 0){
      stamp.classList.add('show');
      if (allGood){
        stampText.textContent = 'MATCHED';
      } else {
        stamp.classList.add('discrepancy');
        stampText.textContent = mismatched + missing + ' ISSUE' + ((mismatched + missing) === 1 ? '' : 'S') + ' FOUND';
      }
    }
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  compareBtn.addEventListener('click', () => {
    if (!state.a || !state.b) return;
    revokeAllObjectUrls();
    currentRows = compare();
    currentCards = buildGalleryCards(currentRows);
    currentFilter = 'all';
    galleryFilter = 'all';
    currentView = currentCards.length ? 'gallery' : 'manifest';
    renderAll();
    renderPrintHeader();
    exportBtn.disabled = false;
    statusLine.textContent = 'Comparison complete.';
  });

  function renderPrintHeader(){
    const rootA = state.a.rootName || 'Source';
    const rootB = state.b.rootName || 'Target';
    const now = new Date();
    const genTime = now.toLocaleString(undefined, { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
    printHeader.innerHTML = `
      <div class="pr-row"><b>Source (A):</b> ${escapeHtml(rootA)}</div>
      <div class="pr-row"><b>Target (B):</b> ${escapeHtml(rootB)}</div>
      <div class="pr-row"><b>Generated:</b> ${escapeHtml(genTime)}</div>
    `;
  }

  exportBtn.addEventListener('click', () => {
    if (!currentRows.length) return;
    const savedView = currentView;
    currentView = 'manifest';
    renderAll();
    // Print view always shows every row expanded, regardless of the on-screen filter/collapse state.
    document.querySelectorAll('.row').forEach(r => r.classList.add('open'));
    window.print();
    currentView = savedView;
    renderAll();
  });

  resetBtn.addEventListener('click', () => {
    state.a = null; state.b = null;
    inputA.value = ''; inputB.value = '';
    dzA.classList.remove('loaded'); dzB.classList.remove('loaded');
    nameA.textContent = 'No folder selected';
    nameB.textContent = 'No folder selected';
    hintA.textContent = 'Click to browse, or drag a folder here';
    hintB.textContent = 'Click to browse, or drag a folder here';
    compareBtn.disabled = true;
    exportBtn.disabled = true;
    statusLine.textContent = '';
    results.innerHTML = '';
    printHeader.innerHTML = '';
    stamp.classList.remove('show', 'discrepancy');
    revokeAllObjectUrls();
    currentRows = [];
    currentCards = [];
    currentView = 'manifest';
    currentFilter = 'all';
    galleryFilter = 'all';
  });

})();
</script>
</body>
</html>
